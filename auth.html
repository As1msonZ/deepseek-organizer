<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 350px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
        }
        .auth-container {
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .token-input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }
        .token-input::placeholder {
            color: rgba(255,255,255,0.7);
        }
        .activate-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .activate-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .error-message {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }
        .success-message {
            color: #51cf66;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }
        .features {
            margin-top: 20px;
            text-align: left;
            font-size: 12px;
        }
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            opacity: 0.9;
        }
        .feature::before {
            content: "✓";
            margin-right: 8px;
            color: #51cf66;
            font-weight: bold;
        }
        .contact {
            margin-top: 16px;
            font-size: 11px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">🗂️ DeepSeek Organizer</div>
        <div class="subtitle">Расширение для организации чатов</div>
        
        <div class="input-group">
            <input type="text" id="token-input" class="token-input" 
                   placeholder="Введите токен доступа" autocomplete="off">
        </div>
        
        <button id="activate-btn" class="activate-btn">Активировать расширение</button>
        
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        
        <div class="features">
            <div class="feature">Группировка чатов</div>
            <div class="feature">Перетаскивание между группами</div>
            <div class="feature">Счетчик токенов</div>
            <div class="feature">Синхронизация настроек</div>
        </div>
        
        <div class="contact">
            Для получения токена обратитесь к разработчику telegram @As1msonZ
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
